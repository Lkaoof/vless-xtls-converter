<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VLESS Converter — Podkop Edition</title>
    <meta name="description"
        content="Конвертер VLESS XHTTP / gRPC / TCP + Reality/TLS ссылок в sing-box JSON конфигурацию для Podkop">
    <link rel="icon" type="image/svg+xml"
        href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0%25' stop-color='%2306b6d4'/%3E%3Cstop offset='100%25' stop-color='%238b5cf6'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='14' fill='%230f172a'/%3E%3Cpath d='M18 22l10 20L38 22' stroke='url(%23g)' stroke-width='5' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3Cpath d='M38 28h8m-8 6h8m-8 6h6' stroke='%2306b6d4' stroke-width='3' fill='none' stroke-linecap='round' opacity='0.7'/%3E%3C/svg%3E">
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap"
        rel="stylesheet">
    <style>
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #07090f;
            --bg-secondary: #0c1019;
            --bg-card: rgba(15, 20, 35, 0.7);
            --bg-input: #080b14;
            --border: rgba(255, 255, 255, 0.06);
            --border-hover: rgba(6, 182, 212, 0.25);
            --text-primary: #e8edf5;
            --text-secondary: #8892a8;
            --text-muted: #4a5568;
            --accent-cyan: #06d6a0;
            --accent-purple: #8b5cf6;
            --accent-blue: #3b82f6;
            --accent-green: #10b981;
            --accent-red: #f43f5e;
            --accent-amber: #f59e0b;
            --glow-primary: rgba(6, 214, 160, 0.08);
            --glow-purple: rgba(139, 92, 246, 0.06);
            --radius: 14px;
            --font-mono: 'JetBrains Mono', 'Fira Code', monospace;
            --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        body {
            background: var(--bg-primary);
            color: var(--text-primary);
            font-family: var(--font-sans);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: 50px 20px 40px;
            overflow-x: hidden;
            position: relative;
        }

        /* Animated background */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background:
                radial-gradient(ellipse 800px 600px at 20% 10%, var(--glow-primary) 0%, transparent 70%),
                radial-gradient(ellipse 600px 500px at 80% 80%, var(--glow-purple) 0%, transparent 70%),
                radial-gradient(ellipse 400px 300px at 50% 50%, rgba(59, 130, 246, 0.03) 0%, transparent 70%);
            pointer-events: none;
            z-index: 0;
            animation: bgPulse 20s ease-in-out infinite alternate;
        }

        /* Grid pattern overlay */
        body::after {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image:
                linear-gradient(rgba(255, 255, 255, 0.015) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.015) 1px, transparent 1px);
            background-size: 60px 60px;
            pointer-events: none;
            z-index: 0;
        }

        @keyframes bgPulse {
            0% {
                opacity: 1;
            }

            50% {
                opacity: 0.6;
            }

            100% {
                opacity: 1;
            }
        }

        .container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 780px;
        }

        /* ─── Header ─── */
        .header {
            text-align: center;
            margin-bottom: 40px;
            position: relative;
        }

        .header-icon {
            width: 56px;
            height: 56px;
            margin: 0 auto 18px;
            background: linear-gradient(135deg, var(--accent-cyan), var(--accent-purple));
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow:
                0 0 40px rgba(6, 214, 160, 0.2),
                0 0 80px rgba(6, 214, 160, 0.05);
            animation: iconFloat 4s ease-in-out infinite;
        }

        @keyframes iconFloat {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-4px);
            }
        }

        .header-icon svg {
            width: 28px;
            height: 28px;
        }

        .header h1 {
            font-size: 1.75em;
            font-weight: 800;
            letter-spacing: -0.03em;
            color: #fff;
            margin-bottom: 6px;
        }

        .header h1 .gradient-text {
            background: linear-gradient(135deg, var(--accent-cyan) 0%, var(--accent-purple) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            background: rgba(6, 214, 160, 0.08);
            border: 1px solid rgba(6, 214, 160, 0.2);
            color: var(--accent-cyan);
            font-size: 0.55em;
            font-weight: 700;
            padding: 4px 10px;
            border-radius: 6px;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            vertical-align: middle;
            margin-left: 8px;
            -webkit-text-fill-color: var(--accent-cyan);
        }

        .header .subtitle {
            color: var(--text-muted);
            font-size: 0.88em;
            font-weight: 400;
            letter-spacing: 0.02em;
        }

        .header .subtitle span {
            color: var(--text-secondary);
            font-weight: 500;
        }

        /* ─── Cards ─── */
        .card {
            position: relative;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 24px;
            margin-bottom: 16px;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            transition: border-color 0.4s ease, box-shadow 0.4s ease;
        }

        .card:hover {
            border-color: var(--border-hover);
            box-shadow: 0 0 40px rgba(6, 214, 160, 0.04);
        }

        .card-label {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.72em;
            font-weight: 700;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.12em;
            margin-bottom: 16px;
        }

        .card-label .icon-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 28px;
            height: 28px;
            border-radius: 8px;
            background: rgba(6, 214, 160, 0.08);
        }

        .card-label svg {
            width: 14px;
            height: 14px;
            color: var(--accent-cyan);
        }

        /* ─── Input ─── */
        textarea {
            width: 100%;
            height: 90px;
            background: var(--bg-input);
            border: 1px solid var(--border);
            color: var(--text-primary);
            font-family: var(--font-mono);
            font-size: 0.82em;
            padding: 16px;
            border-radius: 10px;
            resize: vertical;
            outline: none;
            transition: border-color 0.3s, box-shadow 0.3s;
            line-height: 1.7;
        }

        textarea::placeholder {
            color: var(--text-muted);
            font-size: 0.95em;
        }

        textarea:focus {
            border-color: rgba(6, 214, 160, 0.4);
            box-shadow: 0 0 0 3px rgba(6, 214, 160, 0.06), 0 0 20px rgba(6, 214, 160, 0.05);
        }

        /* ─── Button ─── */
        .btn-wrapper {
            position: relative;
            margin-top: 16px;
        }

        .btn {
            position: relative;
            width: 100%;
            padding: 15px 24px;
            background: linear-gradient(135deg, var(--accent-cyan), var(--accent-blue));
            color: #fff;
            border: none;
            font-family: var(--font-sans);
            font-size: 0.88em;
            font-weight: 700;
            cursor: pointer;
            border-radius: 10px;
            letter-spacing: 0.02em;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            overflow: hidden;
            z-index: 1;
        }

        .btn::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, transparent 0%, rgba(255, 255, 255, 0.12) 50%, transparent 100%);
            opacity: 0;
            transition: opacity 0.3s;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow:
                0 8px 25px rgba(6, 214, 160, 0.25),
                0 0 60px rgba(6, 214, 160, 0.1);
        }

        .btn:hover::before {
            opacity: 1;
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn svg {
            width: 16px;
            height: 16px;
            transition: transform 0.3s;
        }

        .btn:hover svg {
            transform: rotate(90deg);
        }

        /* ─── Output ─── */
        .output-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 14px;
        }

        .copy-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border);
            color: var(--text-secondary);
            font-family: var(--font-sans);
            font-size: 0.72em;
            font-weight: 600;
            padding: 7px 14px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.25s;
            letter-spacing: 0.02em;
        }

        .copy-btn:hover {
            background: rgba(6, 214, 160, 0.08);
            border-color: rgba(6, 214, 160, 0.25);
            color: var(--accent-cyan);
        }

        .copy-btn.copied {
            background: rgba(16, 185, 129, 0.1);
            border-color: rgba(16, 185, 129, 0.3);
            color: var(--accent-green);
        }

        .copy-btn svg {
            width: 13px;
            height: 13px;
        }

        pre {
            width: 100%;
            min-height: 100px;
            max-height: 480px;
            background: var(--bg-input);
            color: var(--text-primary);
            font-family: var(--font-mono);
            font-size: 0.8em;
            line-height: 1.75;
            padding: 20px;
            margin: 0;
            overflow: auto;
            white-space: pre-wrap;
            border: 1px solid var(--border);
            border-radius: 10px;
            transition: border-color 0.3s;
        }

        pre::-webkit-scrollbar {
            width: 5px;
        }

        pre::-webkit-scrollbar-track {
            background: transparent;
        }

        pre::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.08);
            border-radius: 3px;
        }

        pre::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        /* Syntax colors */
        pre .key {
            color: #67e8f9;
        }

        pre .string {
            color: #fbbf24;
        }

        pre .number {
            color: var(--accent-green);
        }

        pre .boolean {
            color: var(--accent-purple);
        }

        pre .null {
            color: var(--text-muted);
        }

        .placeholder-text {
            color: var(--text-muted);
            font-family: var(--font-sans);
            font-style: italic;
            font-size: 0.9em;
        }

        .error-text {
            color: var(--accent-red);
            font-family: var(--font-sans);
        }

        /* ─── Toast ─── */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: rgba(16, 185, 129, 0.12);
            border: 1px solid rgba(16, 185, 129, 0.3);
            color: var(--accent-green);
            font-family: var(--font-sans);
            font-size: 0.82em;
            font-weight: 600;
            padding: 10px 22px;
            border-radius: 10px;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            z-index: 100;
            opacity: 0;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            pointer-events: none;
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* ─── Stats bar ─── */
        .stats-bar {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            margin-top: 14px;
            opacity: 0;
            transform: translateY(6px);
            transition: all 0.4s ease;
        }

        .stats-bar.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .stat-chip {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border);
            font-family: var(--font-mono);
            font-size: 0.68em;
            font-weight: 500;
            color: var(--text-secondary);
            padding: 4px 10px;
            border-radius: 6px;
        }

        .stat-chip .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            display: inline-block;
        }

        .dot-green {
            background: var(--accent-green);
            box-shadow: 0 0 6px rgba(16, 185, 129, 0.5);
        }

        .dot-purple {
            background: var(--accent-purple);
            box-shadow: 0 0 6px rgba(139, 92, 246, 0.5);
        }

        .dot-amber {
            background: var(--accent-amber);
            box-shadow: 0 0 6px rgba(245, 158, 11, 0.5);
        }

        .dot-cyan {
            background: var(--accent-cyan);
            box-shadow: 0 0 6px rgba(6, 214, 160, 0.5);
        }

        /* ─── Footer ─── */
        .footer {
            text-align: center;
            margin-top: 28px;
            padding-top: 20px;
            border-top: 1px solid var(--border);
            color: var(--text-muted);
            font-size: 0.72em;
            letter-spacing: 0.01em;
        }

        .footer a {
            color: var(--text-secondary);
            text-decoration: none;
            transition: color 0.25s;
            font-weight: 500;
        }

        .footer a:hover {
            color: var(--accent-cyan);
        }

        .footer .divider {
            margin: 0 8px;
            opacity: 0.3;
        }

        /* ─── Responsive ─── */
        @media (max-width: 640px) {
            body {
                padding: 24px 14px 30px;
            }

            .card {
                padding: 18px;
                border-radius: 12px;
            }

            .header h1 {
                font-size: 1.35em;
            }

            .header-icon {
                width: 46px;
                height: 46px;
                border-radius: 13px;
            }

            textarea {
                font-size: 0.78em;
                height: 80px;
            }

            pre {
                font-size: 0.72em;
                padding: 14px;
            }

            .badge {
                font-size: 0.5em;
            }
        }

        /* ─── Animate card entrance ─── */
        .card {
            animation: cardIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) backwards;
        }

        .card:nth-child(2) {
            animation-delay: 0.1s;
        }

        @keyframes cardIn {
            from {
                opacity: 0;
                transform: translateY(16px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="header">
            <div class="header-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round"
                    stroke-linejoin="round">
                    <polyline points="4 4 10 16 16 4"></polyline>
                    <line x1="16" y1="10" x2="20" y2="10"></line>

            </div>

            <div class="card-label">
                <div class="icon-wrapper">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round">
                        <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path>

                <button class="btn" onclick="convertURL()" id="convertBtn">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"
                        stroke-linejoin="round">
                        <polyline points="16 3 21 3 21 8"></polyline>
                        <line x1="4" y1="20" x2="21" y2="3"></line>
                        <polyline points="21 16 21 21 16 21"></polyline>
                        <line x1="15" y1="15" x2="21" y2="21"></line>

                </button>

        <div class="card" id="outputCard">
            <div class="output-header">
                <div class="card-label" style="margin-bottom: 0;">
                    <div class="icon-wrapper">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                            stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="16 18 22 12 16 6"></polyline>
                            <polyline points="8 6 2 12 8 18"></polyline>
                        </svg>
                    </div>

                </div>
                <button class="copy-btn" id="copyBtn" onclick="copyJSON()">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round">
                        <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                        <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                    </svg>
                    <span id="copyText">Копировать</span>

            </div>
            <pre id="jsonOutput"><span class="placeholder-text">JSON конфигурация появится здесь...</span></pre>
            <div class="stats-bar" id="statsBar"></div>

        <div class="footer">
            Создано для <a href="https://github.com/itdoginfo/podkop" target="_blank">Podkop</a>
            <span class="divider">•</span>
            sing-box outbound config generator
        </div>
    </div>

    <!-- Toast -->
    <div class="toast" id="toast">✓ Скопировано в буфер обмена</div>

    <script>
        function parseQuery(q) {
            var map = {};
            if (!q) return map;
            var pairs = q.split('&');
            for (var i = 0; i < pairs.length; i++) {
                var eq = pairs[i].indexOf('=');
                if (eq === -1) map[decodeURIComponent(pairs[i])] = '';
                else map[decodeURIComponent(pairs[i].substring(0, eq))] = decodeURIComponent(pairs[i].substring(eq + 1));
            }
            return map;
        }

        function copyToClipboard(text, onDone) {
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(text).then(function() { onDone(true); }, function() { onDone(false); });
            } else {
                var ta = document.createElement('textarea');
                ta.value = text;
                ta.style.cssText = 'position:fixed;left:-9999px';
                document.body.appendChild(ta);
                ta.select();
                try { document.execCommand('copy'); onDone(true); }
                catch(_) { onDone(false); }
                document.body.removeChild(ta);
            }
        }

        function applyMapping(src, dst, strMap, rawMap) {
            for (var sk in strMap) { if (src[sk] !== undefined) dst[strMap[sk]] = String(src[sk]); }
            for (var rk in rawMap) { if (src[rk] !== undefined) dst[rawMap[rk]] = src[rk]; }
        }

        function convertURL() {
            var out = document.getElementById('jsonOutput');
            var bar = document.getElementById('statsBar');
            var raw = document.getElementById('urlInput').value.trim();

            if (raw.indexOf('vless://') !== 0) {
                out.innerHTML = '<span class="error-text">\u274C \u0421\u0441\u044B\u043B\u043A\u0430 \u0434\u043E\u043B\u0436\u043D\u0430 \u043D\u0430\u0447\u0438\u043D\u0430\u0442\u044C\u0441\u044F \u0441 vless://</span>';
                bar.classList.remove('visible');
                return;
            }

            try {
                var rest = raw.slice(8);
                var at = rest.indexOf('@');
                if (at === -1) throw new Error('\u041D\u0435 \u043D\u0430\u0439\u0434\u0435\u043D \u0441\u0438\u043C\u0432\u043E\u043B @');
                var uuid = rest.substring(0, at);
                if (uuid.length < 36) throw new Error('UUID \u043E\u0442\u0441\u0443\u0442\u0441\u0442\u0432\u0443\u0435\u0442 \u0438\u043B\u0438 \u0441\u043B\u0438\u0448\u043A\u043E\u043C \u043A\u043E\u0440\u043E\u0442\u043A\u0438\u0439');

                var tail = rest.substring(at + 1);
                var qi = tail.indexOf('?');
                var hi = tail.indexOf('#');
                var hostPort, qs, hash;

                if (hi !== -1 && (qi === -1 || hi < qi)) {
                    hostPort = tail.substring(0, hi);
                    hash = tail.substring(hi + 1);
                    qs = '';
                } else {
                    hostPort = qi !== -1 ? tail.substring(0, qi) : tail;
                    var afterQ = qi !== -1 ? tail.substring(qi + 1) : '';
                    var hi2 = afterQ.indexOf('#');
                    qs = hi2 !== -1 ? afterQ.substring(0, hi2) : afterQ;
                    hash = hi2 !== -1 ? afterQ.substring(hi2 + 1) : '';
                }

                var server = '', port = 443;
                if (hostPort.indexOf('[') === 0) {
                    var cb = hostPort.indexOf(']');
                    if (cb === -1) throw new Error('\u041D\u0435\u043A\u043E\u0440\u0440\u0435\u043A\u0442\u043D\u044B\u0439 IPv6 \u0430\u0434\u0440\u0435\u0441');
                    server = hostPort.substring(1, cb);
                    var ab = hostPort.substring(cb + 1);
                    if (ab.indexOf(':') === 0) port = parseInt(ab.substring(1), 10) || 443;
                } else {
                    var ci = hostPort.lastIndexOf(':');
                    if (ci !== -1) { server = hostPort.substring(0, ci); port = parseInt(hostPort.substring(ci + 1), 10) || 443; }
                    else server = hostPort;
                }

                var p = parseQuery(qs);
                var type = p.type || 'tcp';
                var security = p.security || '';
                var isR = security === 'reality';
                var isT = security === 'tls';
                var isSecure = isR || isT;
                var sni = p.sni || '';

                var cfg = { type: 'vless', tag: hash ? decodeURIComponent(hash) : 'VLESS', server: server, server_port: port, uuid: uuid };

                if (isSecure) {
                    var alpn = [];
                    if (p.alpn) alpn = p.alpn.split(',');
                    else if (type === 'xhttp') alpn = ['h2', 'http/1.1'];
                    else if (type === 'grpc') alpn = ['h2'];

                    var tls = { enabled: true, server_name: sni, alpn: alpn };
                    if (isR) {
                        tls.reality = { enabled: true, public_key: p.pbk || '', short_id: p.sid || '' };
                        tls.utls = { enabled: true, fingerprint: p.fp || 'chrome' };
                    } else if (isT) {
                        if (p.allowInsecure !== undefined) tls.insecure = p.allowInsecure === '1';
                        if (p.fp !== undefined) tls.utls = { enabled: true, fingerprint: p.fp || 'chrome' };
                    }
                    cfg.tls = tls;
                    if (type === 'tcp' || type === 'grpc') cfg.packet_encoding = 'xudp';
                }

                if (type === 'tcp' && isR) {
                    cfg.flow = 'xtls-rprx-vision';
                } else if (type === 'xhttp') {
                    var tp = { type: 'xhttp', path: p.path || '/', mode: p.mode || 'auto', x_padding_bytes: p.x_padding_bytes || '100-1000' };
                    if (p.host || sni) tp.host = p.host || sni;

                    if (p.extra) {
                        try {
                            var ex = JSON.parse(p.extra);
                            applyMapping(ex, tp,
                                { xPaddingBytes: 'x_padding_bytes', scStreamUpServerSecs: 'sc_stream_up_server_secs' },
                                { noGRPCHeader: 'no_grpc_header', scMaxEachPostBytes: 'sc_max_each_post_bytes', scMinPostsIntervalMs: 'sc_min_posts_interval_ms' }
                            );
                            if (ex.xmux && typeof ex.xmux === 'object') {
                                var xm = {};
                                applyMapping(ex.xmux, xm,
                                    { maxConcurrency: 'max_concurrency', hMaxRequestTimes: 'h_max_request_times', hMaxReusableSecs: 'h_max_reusable_secs' },
                                    { maxConnections: 'max_connections', cMaxReuseTimes: 'c_max_reuse_times', hKeepAlivePeriod: 'h_keep_alive_period' }
                                );
                                var hasXm = false;
                                for (var xk in xm) { if (xm.hasOwnProperty(xk)) { hasXm = true; break; } }
                                if (hasXm) tp.xmux = xm;
                            }
                        } catch (_) {}
                    }
                    cfg.transport = tp;
                } else if (type === 'grpc') {
                    cfg.transport = { type: 'grpc', service_name: p.serviceName || '' };
                }

                out.innerHTML = syntaxHighlight(cfg);

                var secLbl = isR ? 'Reality' : isT ? 'TLS' : 'None';
                var tpLbl = type === 'xhttp' ? (p.mode || 'auto') : type === 'grpc' ? 'gRPC' : 'tcp';
                bar.innerHTML =
                    '<span class="stat-chip"><span class="dot dot-green"></span>' + secLbl + '</span>' +
                    '<span class="stat-chip"><span class="dot dot-purple"></span>' + type.toUpperCase() + '</span>' +
                    '<span class="stat-chip"><span class="dot dot-amber"></span>Port ' + port + '</span>' +
                    '<span class="stat-chip"><span class="dot dot-cyan"></span>' + tpLbl + '</span>';
                bar.classList.add('visible');

            } catch (e) {
                out.innerHTML = '<span class="error-text">\u274C \u041E\u0448\u0438\u0431\u043A\u0430: ' + e.message + '</span>';
                bar.classList.remove('visible');
            }
        }

        function copyJSON() {
            var pre = document.getElementById('jsonOutput');
            if (pre.querySelector('.placeholder-text') || pre.querySelector('.error-text')) return;

            var btn = document.getElementById('copyBtn');
            var txt = document.getElementById('copyText');
            var toast = document.getElementById('toast');

            function reset() { btn.classList.remove('copied'); txt.textContent = '\u041A\u043E\u043F\u0438\u0440\u043E\u0432\u0430\u0442\u044C'; toast.classList.remove('show'); }

            copyToClipboard(pre.innerText || pre.textContent, function(ok) {
                if (ok) {
                    btn.classList.add('copied');
                    txt.textContent = '\u0421\u043A\u043E\u043F\u0438\u0440\u043E\u0432\u0430\u043D\u043E!';
                    toast.classList.add('show');
                    setTimeout(reset, 2000);
                } else {
                    txt.textContent = '\u041E\u0448\u0438\u0431\u043A\u0430';
                    setTimeout(function() { txt.textContent = '\u041A\u043E\u043F\u0438\u0440\u043E\u0432\u0430\u0442\u044C'; }, 2000);
                }
            });
        }

        function syntaxHighlight(json) {
            if (typeof json !== 'string') json = JSON.stringify(json, undefined, 2);
            json = json.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
            return json.replace(
                /("(\\u[a-zA-Z0-9]{4}|\\[^u]|[^\\"])*"(\s*:)?|\b(true|false|null)\b|-?\d+(?:\.\d*)?(?:[eE][+\-]?\d+)?)/g,
                function(match) {
                    var cls = 'number';
                    if (/^"/.test(match)) { cls = /:$/.test(match) ? 'key' : 'string'; }
                    else if (/true|false/.test(match)) cls = 'boolean';
                    else if (/null/.test(match)) cls = 'null';
                    return '<span class="' + cls + '">' + match + '</span>';
                }
            );
        }

        document.getElementById('urlInput').addEventListener('keydown', function(e) {
            if ((e.key === 'Enter' || e.keyCode === 13) && !e.shiftKey) {
                e.preventDefault();
                convertURL();
            }
        });
    </script>
